[package]
name = "mend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "All-or-nothing multi-file edits for coding agents, in the Codex apply_patch format"
repository = "https://github.com/knutwannheden/mend"
keywords = ["patch", "apply-patch", "codex", "agent", "edit"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[dependencies]
similar = "3"
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
anyhow = "1"
assert_cmd = "2"
pretty_assertions = "1"
tempfile = "3"

# Keeps cargo from adopting a manifest in a parent directory, as happens in a git worktree
# nested under another checkout.
[workspace]
