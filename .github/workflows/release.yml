name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # crates.io accepts a trusted publish only from this workflow file and environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag names the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo test --locked
      # Trusted publishing needs the crate to exist, so the first version is published by hand.
      # A version crates.io already has is skipped and still gets its GitHub release.
      - name: Check whether crates.io has the version
        id: crates_io
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'mend release workflow (https://github.com/knutwannheden/mend)' \
            "https://crates.io/api/v1/crates/mend/$VERSION")
          echo "published=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crates_io.outputs.published != 'true'
        id: auth
      - if: steps.crates_io.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
